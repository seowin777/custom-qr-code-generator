<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why did you remove it?</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8EBLTR31XT"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-8EBLTR31XT');
  gtag('event', 'uninstall', {extension: 'custom-qr-code-generator'});
  function why(reason) {
    gtag('event', 'uninstall_' + reason, {extension: 'custom-qr-code-generator'}); // one event per reason, as in the template
    document.querySelector('main').innerHTML = '<h1>Thanks</h1>';
  }
</script>
<style>
  :root { --bg:#fff; --text:#1f2328; --line:#d0d7de; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1f1f; --text:#e8eaed; --line:#3c4043; } }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:520px; margin:0 auto; padding:48px 16px; text-align:center; }
  button { display:block; width:100%; margin:8px 0; padding:12px; font:inherit; cursor:pointer;
           background:none; color:inherit; border:1px solid var(--line); border-radius:8px; }
</style>
</head>
<body>
<main>
  <h1>Why did you remove it?</h1>
  <button onclick="why('no_scan')">The code did not scan</button>
  <button onclick="why('missing_feature')">It lacks a feature I need</button>
  <button onclick="why('chrome_has_it')">Chrome already makes QR codes</button>
  <button onclick="why('hard')">Too hard to use</button>
  <button onclick="why('other')">Other</button>
</main>
</body>
</html>
