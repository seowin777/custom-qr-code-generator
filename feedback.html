<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What went wrong?</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8EBLTR31XT"></script>
<script>
  // Opened from the extension's rating row after 1-3 stars: ?s=<stars>&v=<version>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-8EBLTR31XT');
  const q = new URLSearchParams(location.search), ext = {extension: 'custom-qr-code-generator', version: q.get('v') || ''};
  gtag('event', 'feedback_stars_' + (q.get('s') || '0'), ext);
  function send() {
    const picked = [...document.querySelectorAll('input:checked')].map((i) => i.value);
    if (!picked.length) return;
    for (const r of picked) gtag('event', 'feedback_' + r, ext); // one event per reason, like the uninstall page
    document.querySelector('main').innerHTML = '<h1>Thank you</h1><p>We read every answer and fix what people pick most.</p>';
  }
</script>
<style>
  :root { --bg:#fff; --text:#1f2328; --muted:#59636e; --line:#d0d7de; --accent:#1f2328; --on:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1f1f; --text:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --accent:#e8eaed; --on:#1f1f1f; } }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:520px; margin:0 auto; padding:48px 16px; }
  h1 { text-align:center; margin:0 0 4px; }
  p { text-align:center; color:var(--muted); margin:0 0 24px; }
  label { display:flex; align-items:center; gap:12px; margin:8px 0; padding:12px; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  label:has(input:checked) { border-color:var(--accent); }
  input { width:18px; height:18px; margin:0; accent-color:var(--accent); }
  button { display:block; width:100%; margin-top:16px; padding:12px; font:inherit; font-weight:600; cursor:pointer;
           background:var(--accent); color:var(--on); border:0; border-radius:8px; }
  button:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<main>
  <h1>What went wrong?</h1>
  <p>Pick everything that applies. We use it to fix Custom QR Code Generator.</p>
  <label><input type="checkbox" value="no_scan"> The code does not scan</label>
  <label><input type="checkbox" value="looks"> I can't make the code look the way I want</label>
  <label><input type="checkbox" value="missing_feature"> A feature I need is missing</label>
  <label><input type="checkbox" value="bulk"> Bulk codes from a table don't work for me</label>
  <label><input type="checkbox" value="hard"> Hard to figure out</label>
  <label><input type="checkbox" value="bug"> Something is broken</label>
  <label><input type="checkbox" value="other"> Something else</label>
  <button id="go" onclick="send()" disabled>Send</button>
</main>
<script>
  const go = document.getElementById('go');
  document.addEventListener('change', () => { go.disabled = !document.querySelector('input:checked'); });
</script>
</body>
</html>
